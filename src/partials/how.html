<section class="section" aria-labelledby="how-title">
  <div class="wrap">
    <p class="eyebrow">{{t.how.eyebrow}}</p>
    <h2 id="how-title">{{t.how.title}}</h2>
    <ol class="steps">
      <li class="step step-listen">
        {{> icon-listen}}
        <h3>{{t.how.step1Title}}</h3>
        <p>{{t.how.step1Text}}</p>
      </li>
      <li class="step step-recap">
        {{> icon-recap}}
        <h3>{{t.how.step2Title}}</h3>
        <p>{{t.how.step2Text}}</p>
      </li>
      <li class="step step-follow">
        {{> icon-follow}}
        <h3>{{t.how.step3Title}}</h3>
        <p>{{t.how.step3Text}}</p>
      </li>
    </ol>
  </div>
</section>
