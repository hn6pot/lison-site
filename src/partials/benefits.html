<section class="section section-tint" aria-labelledby="benefits-title">
  <div class="wrap">
    <p class="eyebrow">{{t.benefits.eyebrow}}</p>
    <h2 id="benefits-title">{{t.benefits.title}}</h2>
    <div class="benefits">
      <article class="benefit">
        <h3>{{t.benefits.item1Title}}</h3>
        <p>{{t.benefits.item1Text}}</p>
      </article>
      <article class="benefit">
        <h3>{{t.benefits.item2Title}}</h3>
        <p>{{t.benefits.item2Text}}</p>
      </article>
      <article class="benefit">
        <h3>{{t.benefits.item3Title}}</h3>
        <p>{{t.benefits.item3Text}}</p>
      </article>
      <article class="benefit benefit-aside">
        <h3>{{t.benefits.item4Title}}</h3>
        <p>{{t.benefits.item4Text}}</p>
      </article>
    </div>
  </div>
</section>
