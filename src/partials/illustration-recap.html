<figure class="recap-card" role="img" aria-label="{{t.illustration.label}}">
  <div class="recap-pill"><span class="recap-pill-dot"></span>{{t.illustration.recording}}</div>
  <div class="recap-head">
    <strong>{{t.illustration.meeting}}</strong>
    <span>{{t.illustration.when}}</span>
  </div>
  <div class="recap-block">
    <span class="recap-label">{{t.illustration.decisionsLabel}}</span>
    <p class="recap-decision">{{t.illustration.decision}}</p>
    <p class="recap-quote">{{t.illustration.quote}}</p>
  </div>
  <div class="recap-block">
    <span class="recap-label">{{t.illustration.actionsLabel}}</span>
    <div class="recap-action">
      <span class="recap-avatar recap-avatar-a">L</span>
      <span class="recap-action-text"><b>{{t.illustration.action1}}</b><small>{{t.illustration.owner1}} · {{t.illustration.due1}}</small></span>
      <span class="recap-done">{{t.illustration.done}}</span>
    </div>
    <div class="recap-action">
      <span class="recap-avatar recap-avatar-b">M</span>
      <span class="recap-action-text"><b>{{t.illustration.action2}}</b><small>{{t.illustration.owner2}} · {{t.illustration.due2}}</small></span>
      <span class="recap-done">{{t.illustration.done}}</span>
    </div>
  </div>
</figure>
